name: CI

on:
  pull_request:
  push:
    branches: [main, 'chore/**', 'feat/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # `APP_ENV=test` is what permits the fixture provider. Production refuses that
  # combination outright (packages/content/src/env.ts), so CI cannot accidentally
  # publish a build that serves fixtures to readers.
  APP_ENV: test
  CONTENT_SOURCE: fixture
  NEXT_PUBLIC_SITE_URL: https://www.maquinanerd.test
  # Placeholders, not secrets: they satisfy length validation so the webhook and preview
  # suites can exercise signing. Nothing here reaches a real system.
  KAL_EL_WEBHOOK_SECRET: ci-placeholder-webhook-secret-000000
  KAL_EL_PREVIEW_SECRET: ci-placeholder-preview-secret-000000
  LOG_LEVEL: warn

jobs:
  # Fast feedback: everything that needs neither a browser nor a build.
  static:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # No `version`: the action reads `packageManager` from package.json, and refuses both.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:contract
      - run: pnpm test:integration
      - run: pnpm test:security

  # The browser gates. Split from `static` so a lint failure does not cost a browser run,
  # and split by suite so the report says which gate failed rather than "e2e".
  browser:
    name: ${{ matrix.gate }}
    # The visual baselines are rendered on Windows, where the project is developed, and
    # glyph rasterisation moves line breaks between platforms: a Linux render of the same
    # page comes out taller. The visual gate runs where its baselines were made.
    runs-on: ${{ matrix.gate == 'visual' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: static
    strategy:
      fail-fast: false
      matrix:
        # `kalel` is the odd one out: it boots a contract-faithful stand-in CMS and
        # runs the app with CONTENT_SOURCE=kalel against it. Every other gate uses the
        # fixture provider, which hands the routes finished domain objects and therefore
        # never exercises the DTO schemas, the mapper or the media proxy.
        gate: [e2e, a11y, visual, kalel]
    steps:
      - uses: actions/checkout@v4
      # No `version`: the action reads `packageManager` from package.json, and refuses both.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:${{ matrix.gate }}

      # The evidence the Definition of Done asks for, kept whether the gate passed or not:
      # a green run proves the baseline, a red one carries the diff.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.gate }}
          path: |
            artifacts/playwright-report/
            artifacts/playwright/
            artifacts/playwright-kalel/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static
    steps:
      - uses: actions/checkout@v4
      # No `version`: the action reads `packageManager` from package.json, and refuses both.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:performance

  # The image a deployment actually runs. Built in fixture mode, which needs neither a CMS
  # nor a secret, so every pull request proves the Dockerfile itself: pnpm on Alpine, the
  # native `sharp` binary, the standalone trace and the non-root runner.
  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >-
          docker build
          --build-arg APP_ENV=test
          --build-arg CONTENT_SOURCE=fixture
          --build-arg NEXT_PUBLIC_SITE_URL=https://www.maquinanerd.test
          --build-arg KAL_EL_WEBHOOK_SECRET=ci-placeholder-webhook-secret-000000
          --build-arg KAL_EL_PREVIEW_SECRET=ci-placeholder-preview-secret-000000
          --tag maquinanerd-portal:ci .
      - name: Serves, as a user that is not root
        run: |
          set -euo pipefail
          docker run --detach --name portal --publish 3000:3000 \
            --env APP_ENV=test --env CONTENT_SOURCE=fixture \
            --env KAL_EL_WEBHOOK_SECRET=ci-placeholder-webhook-secret-000000 \
            --env KAL_EL_PREVIEW_SECRET=ci-placeholder-preview-secret-000000 \
            maquinanerd-portal:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          test "$(docker exec portal id -u)" != "0"
      # The cover crops (/media/{id}/{variant}-v1.jpg) need sharp's native binary for musl.
      # The fixture has no CMS media to crop, so this does what the route does to an upload —
      # decode an AVIF, crop it on the salient region, write a JPEG — with the sharp the
      # server resolves, from /app, where the traced route looks for it.
      - name: Crops images inside the image
        run: >-
          docker exec --workdir /app portal node -e
          "const s=require('sharp');s({create:{width:64,height:36,channels:3,background:'#8844aa'}}).avif().toBuffer().then((a)=>s(a,{failOn:'truncated'}).resize(32,32,{fit:'cover',position:s.strategy.attention}).flatten({background:'#ffffff'}).jpeg({mozjpeg:true}).toBuffer()).then((b)=>{if(b[0]!==0xff||b[1]!==0xd8)process.exit(1);console.log('sharp ok',b.length)}).catch((e)=>{console.error(e);process.exit(1)})"
      # The old-image table is read from disk at run time, so only the image can prove the
      # standalone trace carried it (outputFileTracingIncludes).
      - name: Sends an old WordPress image URL on
        run: |
          set -euo pipefail
          # Decompressed whole first: `gunzip | head` dies of SIGPIPE under pipefail.
          gunzip -c data/legacy-media.tsv.gz > "$RUNNER_TEMP/legacy-media.tsv"
          check() {
            local path=${1%%$'\t'*} id=${1##*$'\t'} encoded location
            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$path")
            location=$(curl -s -o /dev/null -w '%{redirect_url}' "http://127.0.0.1:3000/wp-content/uploads/$encoded")
            echo "$path -> $location"
            test "$location" = "http://127.0.0.1:3000/media/$id"
          }
          check "$(sed -n 1p "$RUNNER_TEMP/legacy-media.tsv")"
          # And a name outside ASCII, percent-encoded on the wire and decoded by Next.
          check "$(LC_ALL=C grep -m1 -P '[^\x00-\x7F]' "$RUNNER_TEMP/legacy-media.tsv")"
      - if: failure()
        run: docker logs portal || true

  # A migration tool that only runs by hand rots. This proves each one at least starts,
  # parses its flags and prints help — without touching WordPress or Kal El.
  migration-tools:
    name: Migration tools respond to --help
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: static
    steps:
      - uses: actions/checkout@v4
      # No `version`: the action reads `packageManager` from package.json, and refuses both.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm wp:import --help
      - run: pnpm redirects:build --help
      - run: pnpm urls:verify --help
      - run: pnpm kalel:provision --help

  # Nothing that must never be committed may enter the tree.
  hygiene:
    name: No secrets, archives or build output committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refuse forbidden paths
        run: |
          set -euo pipefail
          # `.env.example` is the one env file that belongs in the tree: names, no values.
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.zip$|^\.next/|^artifacts/|^\.migration-reference/|^maquina-nerd-kit/|^uploads/' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "These files must never be committed:"
            echo "$bad"
            exit 1
          fi
      - name: Refuse a hard-coded service token
        run: |
          set -euo pipefail
          # `ke_st.` is the Kal El service-token prefix. Test fixtures use an obvious
          # placeholder, which this pattern deliberately still catches — a token-shaped
          # string does not belong in the tree either way.
          # `playwright.kalel.config.ts` hands the stand-in CMS an all-zero fake token.
          if git grep -nE 'ke_st\.[A-Za-z0-9]{16,}' -- ':!tests' ':!docs' ':!playwright.kalel.config.ts' ; then
            echo "A Kal El service token appears in source."
            exit 1
          fi
