# Máquina Nerd portal on Coolify — "Docker Compose" build pack, deployed from this repository.
#
# The Coolify counterpart of docker-compose.prod.yml, in the shape of Kal El's own
# docker-compose.coolify.yml:
#
#  - No `ports:`. Coolify's proxy (Traefik) routes the generated domain to the port named in
#    SERVICE_URL_PORTAL_3000. Nothing is published on the host, so nobody reaches the
#    container around the proxy to forge X-Forwarded-For, which TRUST_PROXY trusts.
#  - The two signing secrets are Coolify "magic" variables: generated once, stored in the
#    resource's environment, stable across deployments. The webhook one is also the value
#    `pnpm kalel:provision` registers with Kal El (docs/migration/RUNBOOK.md §4.5).
#  - Set in the resource's Environment Variables before the first deployment, by the
#    operator: KAL_EL_BASE_URL (the CMS API's https origin), KAL_EL_SITE_ID,
#    KAL_EL_SERVICE_TOKEN (printed once by `pnpm kalel:provision --new-token`) and, only
#    for images served straight from a remote host, MEDIA_ALLOWED_HOSTS.
#  - Set the domain to https first. NEXT_PUBLIC_SITE_URL is baked into the build: changing
#    the domain means redeploying.
#
# `next build` prerenders from Kal El and validates the environment, and this build pack
# cannot mount a BuildKit secret, so what the build reads is passed as build arguments too.
# Coolify also injects an ARG for every variable of the resource into every stage of the
# Dockerfile, the runner included, so these values reach the image's build metadata on this
# server: readable with `docker history` by whoever can run Docker there — the same people
# who can already read them in the running container's environment.

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${SERVICE_URL_PORTAL}
        - APP_ENV=${APP_ENV:-staging}
        - CONTENT_SOURCE=kalel
        - KAL_EL_BASE_URL=${KAL_EL_BASE_URL}
        - KAL_EL_SITE_ID=${KAL_EL_SITE_ID}
        - KAL_EL_SERVICE_TOKEN=${KAL_EL_SERVICE_TOKEN}
        - KAL_EL_WEBHOOK_SECRET=${SERVICE_BASE64_64_WEBHOOK}
        - KAL_EL_PREVIEW_SECRET=${SERVICE_BASE64_64_PREVIEW}
        - TRUST_PROXY=true
        - MEDIA_ALLOWED_HOSTS=${MEDIA_ALLOWED_HOSTS:-}
        # Publicidade: OpaPreço Ads, ligado por padrão. NEXT_PUBLIC_OPAPRECO_ADS_ENABLED=false
        # tira os slots, o script e a CSP do OpaPreço no próximo build, sem mexer no código.
        - NEXT_PUBLIC_OPAPRECO_ADS_ENABLED=${NEXT_PUBLIC_OPAPRECO_ADS_ENABLED:-}
        - NEXT_PUBLIC_OPAPRECO_ADS_ENDPOINT=${NEXT_PUBLIC_OPAPRECO_ADS_ENDPOINT:-}
        # Google Analytics 4 (`G-…`). Sem ele nada é medido; com ele, só depois do "Aceitar
        # todos" no aviso de privacidade.
        - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    environment:
      # Declares the public URL Coolify generates for this service, routed to port 3000.
      - SERVICE_URL_PORTAL_3000
      - NODE_ENV=production
      # `staging` until the cutover (RUNBOOK §5): the production guards, and noindex.
      - APP_ENV=${APP_ENV:-staging}
      - NEXT_PUBLIC_SITE_URL=${SERVICE_URL_PORTAL}
      - CONTENT_SOURCE=kalel
      - KAL_EL_BASE_URL=${KAL_EL_BASE_URL}
      - KAL_EL_SITE_ID=${KAL_EL_SITE_ID}
      - KAL_EL_SERVICE_TOKEN=${KAL_EL_SERVICE_TOKEN}
      # 64 alphanumeric characters, the generator behind Kal El's SESSION_SECRET on this
      # server; Kal El accepts a webhook secret of 16 to 128.
      - KAL_EL_WEBHOOK_SECRET=${SERVICE_BASE64_64_WEBHOOK}
      - KAL_EL_PREVIEW_SECRET=${SERVICE_BASE64_64_PREVIEW}
      # Exactly one proxy in front (Traefik), which writes X-Forwarded-For itself. Cloudflare
      # ahead of it is recognised by address, not configured (lib/client-address.ts).
      - TRUST_PROXY=true
      - MEDIA_ALLOWED_HOSTS=${MEDIA_ALLOWED_HOSTS:-}
      - KAL_EL_TIMEOUT_MS=${KAL_EL_TIMEOUT_MS:-5000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-60}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Ficha da obra (Cinerie Context Service). Both or neither: without them the ficha
      # simply does not render. The token is the same key set in Cinerie's
      # CINERIE_EDITORIAL_CONTEXT_API_KEYS; runtime only, never a build argument.
      - CINERIE_INTERNAL_URL=${CINERIE_INTERNAL_URL:-}
      - CINERIE_SERVICE_TOKEN=${CINERIE_SERVICE_TOKEN:-}
      # Heap ceiling inside the memory limit below: the 256 MB ISR LRU plus the server's
      # own heap fit with room to spare, and the other ~768 MB are left to sharp/libvips,
      # whose buffers live outside the JS heap.
      - NODE_OPTIONS=--max-old-space-size=768
    # Hardening after the November 2026 intrusion (docs/migration/INCIDENTE-2026-11.md):
    # remote code execution as `nextjs` ran a miner from memory, Tor and a watchdog from
    # /var/tmp, and 1,587 child processes over 8 days, with no CPU or memory ceiling.
    #  - The root filesystem is read-only: no binary dropped next to the code, no rewritten
    #    server.js. The server writes only the image cache (the volume below); pages and
    #    fetches stay in memory (next-cache-handler.mjs).
    #  - /tmp and /var/tmp are small in-memory mounts where nothing can be executed.
    #    (Docker already mounts /dev/shm noexec.)
    #  - No Linux capability and no privilege gain through setuid binaries: the server
    #    needs none (port 3000, a user that is not root).
    #  - `init` reaps orphaned children, which Node as PID 1 does not; `pids_limit` caps
    #    how many processes anything can start.
    #  - CPU and memory ceilings, about 1.5x a normal day: a runaway (or a miner) is
    #    throttled here instead of taking the server's cores from Kal El and the rest.
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Every ceiling in one place: Compose refuses a `pids_limit` beside a
    # `deploy.resources.limits` that does not repeat it ("can't set distinct values").
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
          pids: 256
    healthcheck:
      # Liveness, not readiness: a CMS blip must not get the container killed and restarted
      # into the same blip. `?ready=1` is the operator's check (RUNBOOK §2).
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
    # The ISR cache and the webhook nonces live in the container's MEMORY
    # (next-cache-handler.mjs): one instance is the supported topology (RUNBOOK §3).
    stop_grace_period: 20s
    restart: unless-stopped
    volumes:
      # The only thing the server writes to disk at run time: optimized images, keyed by
      # source URL, width and format, so they survive a deploy unchanged. Anything else
      # written inside the container makes it too slow to remove, and Coolify's swap fails.
      # `-v2`: the first volume was writable by the intruder for 8 days, so the clean
      # deploy starts an empty one; the old `portal-image-cache` is kept for inspection
      # and then removed by hand (docs/migration/RUNBOOK-INCIDENTE-2026-11.md).
      - portal-image-cache-v2:/app/.next/cache/images

volumes:
  portal-image-cache-v2:
