name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTENT_SOURCE: fixture
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      KAL_EL_BASE_URL: http://127.0.0.1:4010
      KAL_EL_SERVICE_TOKEN: ci-placeholder-not-a-secret
      KAL_EL_WEBHOOK_SECRET: ci-placeholder-webhook-secret
      KAL_EL_PREVIEW_SECRET: ci-placeholder-preview-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:contract
      - run: pnpm build
      - run: pnpm test:a11y
      - run: pnpm test:e2e
      - run: pnpm test:visual
      - run: pnpm test:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            test-results/
            playwright-report/
            artifacts/
          if-no-files-found: ignore

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
